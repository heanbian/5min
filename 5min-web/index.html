<body>

<main class="app">
  <header class="topbar">
    <div class="brand">
      <img src="img/logo.svg?v=20261104" width="108" height="32" alt="5min">
      <h1 id="brandTitle">如厕计时器</h1>
    </div>
    <div class="top-tools">
      <div class="ambient" id="ambientWrap">
        <button type="button" class="icon-btn" id="ambientBtn" aria-expanded="false" aria-controls="ambientPanel" aria-label="Ambient sound">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M4 9v6h3.2L12 19.5V4.5L7.2 9H4zm11.5 3a3.5 3.5 0 0 0-1.8-3.1v6.2A3.5 3.5 0 0 0 15.5 12zm-1.8-7.4v1.7a6 6 0 0 1 0 11.4v1.7a7.7 7.7 0 0 0 0-14.8z"/>
          </svg>
        </button>
        <div class="menu-panel" id="ambientPanel" hidden role="group" aria-label="Ambient sound">
          <button type="button" data-ambient="off" class="active">Off</button>
          <button type="button" data-ambient="rain">Rain</button>
          <button type="button" data-ambient="waves">Waves</button>
          <button type="button" data-ambient="clock">Clock</button>
        </div>
      </div>
      <div class="lang" id="langWrap">
        <button type="button" class="lang-trigger" id="langBtn" aria-expanded="false" aria-haspopup="listbox" aria-controls="langPanel" aria-label="Language">
          <span id="langBtnLabel">简体中文</span>
          <svg class="lang-caret" width="12" height="8" viewBox="0 0 12 8" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M1.1 1.2 6 6.1l4.9-4.9 1.1 1.1L6 8.3.0 2.3z"/>
          </svg>
        </button>
        <div class="menu-panel" id="langPanel" hidden role="listbox" aria-label="Language"></div>
      </div>
    </div>
  </header>

  <section class="stage" id="stageSection" aria-label="Timer">
    <div class="dial" role="timer" aria-atomic="true" aria-live="polite">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" id="progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="time" id="timeText" aria-hidden="true"></div>
      <span class="visually-hidden" id="timeLabel">05:00</span>
    </div>
    <div class="cue" id="notice" data-tone="safe">
      <p class="status" id="status">请点击「开始」；计时结束后将提醒起身活动</p>
      <div class="cue-meta" id="dailyStats" aria-live="polite"></div>
    </div>
  </section>

  <section class="actions" id="actionsSection" aria-label="Controls">
    <div class="controls">
      <button class="primary" id="startBtn" type="button">Start</button>
      <button class="ghost" id="resetBtn" type="button" disabled>Reset</button>
    </div>
    <div class="setup">
      <div class="presets" id="presets" role="group" aria-label="Duration presets">
        <button type="button" data-min="3">3 min</button>
        <button type="button" data-min="5" class="active">5 min</button>
        <button type="button" data-min="10">10 min</button>
      </div>
      <div class="scene-select" id="sceneSelect">
        <button type="button" class="scene-trigger" id="sceneTrigger" aria-expanded="false" aria-haspopup="listbox" aria-controls="sceneList">
          <span class="scene-trigger-label" id="sceneTriggerLabel">请选择场景</span>
          <svg class="scene-caret" width="12" height="8" viewBox="0 0 12 8" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M1.1 1.2 6 6.1l4.9-4.9 1.1 1.1L6 8.3.0 2.3z"/>
          </svg>
        </button>
        <ul class="scene-list" id="sceneList" role="listbox" hidden></ul>
      </div>
    </div>
  </section>

  <p class="footnote" id="footnote"></p>
</main>
