# Faster Gradle sync / builds
# JDK 25: allow Gradle native-platform JNI without restricted-method warnings.
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.tooling.parallel=true

kotlin.code.style=official
kotlin.incremental=true

# AGP 9+ defaults (do not opt out of built-in Kotlin / new DSL)
android.useAndroidX=true
android.nonTransitiveRClass=true
