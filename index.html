<main class="app">
  <header class="brand">
    <img src="img/logo.svg" width="108" height="32" alt="5min">
    <h1>如厕计时器</h1>
  </header>

  <section class="stage" aria-label="计时区域">
    <div class="dial" role="timer" aria-atomic="true" aria-live="polite">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" id="progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="time" id="timeText">5:00</div>
    </div>
    <p class="status" id="status">点击开始，到期将提醒起身活动</p>
  </section>

  <section class="actions" aria-label="操作">
    <div class="controls">
      <button class="primary" id="startBtn" type="button" aria-keyshortcuts="Space">开始</button>
      <button class="ghost" id="resetBtn" type="button" disabled>重置</button>
    </div>
    <div class="presets" id="presets" role="group" aria-label="时长预设">
      <button type="button" data-min="3">3 分钟</button>
      <button type="button" data-min="5" class="active">5 分钟</button>
      <button type="button" data-min="10">10 分钟</button>
    </div>
  </section>

  <p class="footnote">
    公开资料常建议将单次如厕时间控制在约 5 分钟以内；使用移动设备易削弱时长感知。本工具仅供习惯提醒，不构成医疗建议。
  </p>
</main>

<script type="module">
/**
 * 5min · 如厕计时器
 * HTML5 + 现代原生 JavaScript（无框架、无构建、无第三方运行时依赖）
 */
const CIRC = 2 * Math.PI * 54;
const PRESET_MINS = Object.freeze([3, 5, 10]);
const VIBRATE_PATTERN = Object.freeze([220, 100, 220, 100, 420, 140, 320]);
const TITLE_IDLE = '如厕计时器 · 五分钟';

/** @type {HTMLElement} */
const progress = document.querySelector('#progress');
/** @type {HTMLElement} */
const timeText = document.querySelector('#timeText');
/** @type {HTMLElement} */
const statusEl = document.querySelector('#status');
/** @type {HTMLButtonElement} */
const startBtn = document.querySelector('#startBtn');
/** @type {HTMLButtonElement} */
const resetBtn = document.querySelector('#resetBtn');
/** @type {HTMLElement} */
const presets = document.querySelector('#presets');

const secRaw = Number.parseInt(new URLSearchParams(location.search).get('sec') ?? '', 10);
const bootSec = Number.isFinite(secRaw) ? Math.min(3600, Math.max(1, secRaw)) : 0;
const defaultMin = bootSec > 0 ? bootSec / 60 : 5;

let totalMs = defaultMin * 60 * 1000;
let remainMs = totalMs;
let endAt = 0;
let running = false;
let finished = false;
let tickId = 0;
let titleBlinkId = 0;
/** @type {AudioContext | null} */
let audioCtx = null;
/** @type {WakeLockSentinel | null} */
let wakeLock = null;
let notifyAsked = false;
let needVibrateOnVisible = false;

progress.style.strokeDasharray = String(CIRC);
progress.style.strokeDashoffset = '0';
progress.classList.add('is-safe');

const fmt = (ms) => {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
};

const stopTitleBlink = () => {
  if (!titleBlinkId) return;
  clearInterval(titleBlinkId);
  titleBlinkId = 0;
};

const startTitleBlink = () => {
  stopTitleBlink();
  let flip = false;
  titleBlinkId = window.setInterval(() => {
    document.title = flip ? '时间到 · 请起身活动' : '0:00 · 五分钟';
    flip = !flip;
  }, 800);
};

const supportsVibrate = () => typeof navigator.vibrate === 'function';

/** Vibration API；定时器回调可能被拦截，故配合通知震动与回前台补震 */
const pulseVibrate = (pattern = VIBRATE_PATTERN) => {
  if (!supportsVibrate()) return false;
  try {
    navigator.vibrate(0);
    return navigator.vibrate([...pattern]) !== false;
  } catch {
    return false;
  }
};

const AudioCtx = globalThis.AudioContext ?? globalThis.webkitAudioContext;

const ensureAudio = async () => {
  if (!AudioCtx) return null;
  audioCtx ??= new AudioCtx();
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch { /* ignore */ }
  }
  return audioCtx;
};

const playToneSeries = async (notes) => {
  try {
    const ctx = await ensureAudio();
    if (!ctx) return;
    const now = ctx.currentTime;
    for (const note of notes) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = note.type ?? 'sine';
      osc.frequency.value = note.freq;
      const t0 = now + (note.at ?? 0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(note.peak ?? 0.16, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (note.dur ?? 0.32));
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + (note.dur ?? 0.32) + 0.02);
    }
  } catch {
    /* 忽略音频失败 */
  }
};

const playChime = () => playToneSeries([
  { freq: 523.25, at: 0, peak: 0.18, dur: 0.35 },
  { freq: 659.25, at: 0.12, peak: 0.18, dur: 0.35 },
  { freq: 783.99, at: 0.24, peak: 0.18, dur: 0.35 },
]);

/** 无 Vibration API 时用低频脉冲音近似触感 */
const playBuzzFallback = () => playToneSeries([
  { freq: 160, type: 'square', at: 0, peak: 0.1, dur: 0.14 },
  { freq: 160, type: 'square', at: 0.2, peak: 0.1, dur: 0.14 },
  { freq: 160, type: 'square', at: 0.4, peak: 0.1, dur: 0.14 },
]);

const maybeNotify = () => {
  if (!('Notification' in globalThis)) return;
  if (Notification.permission !== 'granted') return;
  try {
    const n = new Notification('五分钟 · 时间到', {
      body: '计时已结束，请起身活动。',
      icon: 'img/logo.png',
      tag: '5min-toilet-timer',
      renotify: true,
      silent: false,
      vibrate: [...VIBRATE_PATTERN],
    });
    n.addEventListener('click', () => {
      globalThis.focus();
      pulseVibrate();
      n.close();
    });
    window.setTimeout(() => n.close(), 8000);
  } catch {
    /* Safari 等限制 */
  }
};

const requestNotifyOnce = async () => {
  if (notifyAsked || !('Notification' in globalThis)) return;
  if (Notification.permission !== 'default') return;
  notifyAsked = true;
  try { await Notification.requestPermission(); } catch { /* ignore */ }
};

const alertFinish = () => {
  const vibrated = pulseVibrate();
  window.setTimeout(() => pulseVibrate(), 40);
  window.setTimeout(() => pulseVibrate([300, 100, 400]), 850);
  if (!supportsVibrate() || !vibrated) playBuzzFallback();
  playChime();
  maybeNotify();
};

const acquireWakeLock = async () => {
  if (!('wakeLock' in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
  } catch {
    wakeLock = null;
  }
};

const releaseWakeLock = async () => {
  if (!wakeLock) return;
  try { await wakeLock.release(); } catch { /* ignore */ }
  wakeLock = null;
};

const setPresetsEnabled = (enabled) => {
  for (const btn of presets.querySelectorAll('button[data-min]')) {
    btn.disabled = !enabled;
  }
};

const setTone = (tone) => {
  document.body.classList.toggle('warn', tone === 'warn');
  document.body.classList.toggle('danger', tone === 'danger');
  progress.classList.toggle('is-safe', tone === 'safe');
  progress.classList.toggle('is-warn', tone === 'warn');
  progress.classList.toggle('is-danger', tone === 'danger');
  statusEl.classList.toggle('is-warn', tone === 'warn');
  statusEl.classList.toggle('is-danger', tone === 'danger');
};

const render = () => {
  timeText.textContent = fmt(remainMs);
  const ratio = totalMs > 0 ? Math.min(1, Math.max(0, remainMs / totalMs)) : 0;
  progress.style.strokeDashoffset = String(CIRC * (1 - ratio));

  if (!titleBlinkId) {
    document.title = (running || remainMs < totalMs)
      ? `${fmt(remainMs)} · 五分钟`
      : TITLE_IDLE;
  }

  if (finished) {
    setTone('danger');
    statusEl.textContent = '已超时，请起身活动';
  } else if (remainMs <= 60_000 && (running || remainMs < totalMs)) {
    setTone('warn');
    statusEl.textContent = '最后 1 分钟，请准备结束';
  } else {
    setTone('safe');
    if (running) statusEl.textContent = '计时进行中';
    else if (remainMs < totalMs) statusEl.textContent = '已暂停，点击继续以恢复计时';
    else statusEl.textContent = '点击开始，到期将提醒起身活动';
  }
};

const clearTick = () => {
  if (!tickId) return;
  clearTimeout(tickId);
  tickId = 0;
};

const scheduleTick = () => {
  clearTick();
  if (!running) return;
  const delay = Math.max(16, remainMs % 1000 || 1000);
  tickId = window.setTimeout(tick, delay);
};

const tick = () => {
  if (!running) return;
  remainMs = endAt - Date.now();
  if (remainMs <= 0) {
    remainMs = 0;
    finish();
    return;
  }
  render();
  scheduleTick();
};

const finish = () => {
  running = false;
  finished = true;
  clearTick();
  releaseWakeLock();
  render();
  startBtn.textContent = '再来一次';
  startBtn.disabled = false;
  resetBtn.disabled = false;
  setPresetsEnabled(true);
  needVibrateOnVisible = document.visibilityState !== 'visible';
  alertFinish();
  startTitleBlink();
};

const start = () => {
  if (running) {
    running = false;
    clearTick();
    remainMs = Math.max(0, endAt - Date.now());
    endAt = 0;
    startBtn.textContent = '继续';
    releaseWakeLock();
    setPresetsEnabled(true);
    render();
    return;
  }

  stopTitleBlink();
  requestNotifyOnce();
  ensureAudio();

  if (remainMs <= 0 || finished) {
    remainMs = totalMs;
    finished = false;
  }

  endAt = Date.now() + remainMs;
  running = true;
  finished = false;
  startBtn.textContent = '暂停';
  resetBtn.disabled = false;
  setPresetsEnabled(false);
  render();
  scheduleTick();
  acquireWakeLock();
};

const reset = () => {
  running = false;
  finished = false;
  endAt = 0;
  clearTick();
  stopTitleBlink();
  releaseWakeLock();
  remainMs = totalMs;
  startBtn.textContent = '开始';
  startBtn.disabled = false;
  resetBtn.disabled = true;
  setPresetsEnabled(true);
  render();
};

const setPreset = (min) => {
  if (!Number.isFinite(min) || min <= 0 || running) return;
  totalMs = min * 60 * 1000;
  for (const btn of presets.querySelectorAll('button[data-min]')) {
    btn.classList.toggle('active', Number(btn.dataset.min) === min);
  }
  reset();
};

startBtn.addEventListener('click', start);
resetBtn.addEventListener('click', reset);

presets.addEventListener('click', (event) => {
  const btn = event.target.closest('button[data-min]');
  if (!(btn instanceof HTMLButtonElement) || btn.disabled) return;
  const min = Number(btn.dataset.min);
  if (!PRESET_MINS.includes(min)) return;
  setPreset(min);
});

document.addEventListener('keydown', (event) => {
  if (event.code !== 'Space' && event.key !== ' ') return;
  const tag = event.target instanceof Element ? event.target.tagName : '';
  if (['INPUT', 'TEXTAREA', 'BUTTON', 'SELECT'].includes(tag)) return;
  if (event.target instanceof HTMLElement && event.target.isContentEditable) return;
  event.preventDefault();
  start();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (running) {
    remainMs = endAt - Date.now();
    if (remainMs <= 0) {
      remainMs = 0;
      finish();
    } else {
      render();
      scheduleTick();
      acquireWakeLock();
    }
    return;
  }
  if (!finished) return;
  if (needVibrateOnVisible) {
    needVibrateOnVisible = false;
    pulseVibrate();
    window.setTimeout(() => pulseVibrate([280, 100, 360]), 120);
  }
  startTitleBlink();
});

window.addEventListener('beforeunload', (event) => {
  if (!running) return;
  event.preventDefault();
  event.returnValue = '';
});

render();
</script>
</body>
</html>
