<style>
  :root{
    --bg:#f6f4ef;
    --card:#ffffff;
    --ink:#2b2b2b;
    --muted:#8a8578;
    --ring:#d8d2c4;
    --safe:#4a9d6e;
    --warn:#d9a13b;
    --danger:#d05a4a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100dvh;
    padding:24px;
    transition:background .4s ease;
  }
  body.warn{background:#fbf3e2}
  body.danger{background:#fbe9e6}

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 28px;
  }
  .brand img{
    width:36px;
    height:36px;
    display:block;
  }
  .brand h1{
    font-size:15px;
    font-weight:500;
    letter-spacing:.08em;
    color:var(--muted);
    margin:0;
    text-transform:uppercase;
  }

  .dial{
    position:relative;
    width:min(78vw,300px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }
  .dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:var(--ring);stroke-width:10}
  .progress{
    fill:none;
    stroke:var(--safe);
    stroke-width:10;
    stroke-linecap:round;
    transition:stroke .4s ease;
  }
  .time{
    font-size:clamp(48px,14vw,72px);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
    line-height:1;
  }
  .status{
    margin-top:10px;
    font-size:14px;
    color:var(--muted);
    min-height:20px;
    text-align:center;
    padding:0 12px;
    transition:color .3s ease;

  .controls{
    display:flex;
    gap:12px;

    font-family:inherit;

    padding:14px 32px;

    transition:transform .1s ease, opacity .2s ease, background .2s ease;

    padding:6px 14px;
    font-size:13px;

    background:var(--ink);
    color:#fff;

    opacity:.45;

    margin-top:40px;

<body>

<header class="brand">
  <img src="img/logo.svg" width="40" height="40" alt="5min">
  <h1>五分钟 · 如厕计时</h1>
</header>

<div class="dial" role="timer" aria-atomic="true" aria-live="polite">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <circle class="track" cx="60" cy="60" r="54"></circle>
    <circle class="progress" id="progress" cx="60" cy="60" r="54"></circle>
  </svg>
  <div class="time" id="timeText">5:00</div>
</div>

<div class="status" id="status">点击开始，到点提醒你起来</div>

<div class="controls">
  <button class="primary" id="startBtn" type="button" aria-keyshortcuts="Space">开始</button>
  <button class="ghost" id="resetBtn" type="button" disabled>重置</button>
</div>

<div class="presets" id="presets" role="group" aria-label="时长预设">
  <button type="button" data-min="3">3 分钟</button>
  <button type="button" data-min="5" class="active">5 分钟</button>
  <button type="button" data-min="10">10 分钟</button>
</div>

<p class="footnote">
  医学建议如厕时间控制在 5 分钟内，<br>带手机会让你对时间的感知变钝。<br>
  本工具只做提醒，不替代任何医疗建议。
</p>

<script>
(function(){
  const CIRC = 2 * Math.PI * 54; // 与 SVG r=54 对应
  const PRESET_MINS = [3, 5, 10];
  // 支持 ?sec=2 做短时联调；正常访问默认 5 分钟
  const bootSec = Math.max(1, Math.min(3600, parseInt(new URLSearchParams(location.search).get('sec'), 10) || 0));
  const DEFAULT_MIN = bootSec ? bootSec / 60 : 5;

  const progress = document.getElementById('progress');
  const timeText = document.getElementById('timeText');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const presets  = document.getElementById('presets');

  let totalMs = DEFAULT_MIN * 60 * 1000;
  let remainMs = totalMs;
  let endAt = null;        // 运行时的目标时间戳
  let running = false;
  let tickId = null;
  let finished = false;
  let titleBlinkId = null;
  let audioCtx = null;
  let wakeLock = null;
  let notifyAsked = false;

  progress.style.strokeDasharray = String(CIRC);
  progress.style.strokeDashoffset = '0';

  function fmt(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function stopTitleBlink(){
    if(titleBlinkId){
      clearInterval(titleBlinkId);
      titleBlinkId = null;
    }
  }

  function startTitleBlink(){
    stopTitleBlink();
    let flip = false;
    titleBlinkId = setInterval(function(){
      document.title = flip ? '时间到 · 起来走动' : '0:00 · 五分钟';
      flip = !flip;
    }, 800);
  }

  function ensureAudio(){
    if(audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  function playChime(){
    try{
      const ctx = ensureAudio();
      if(!ctx) return;
      if(ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach(function(freq, i){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02 + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35 + i * 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + 0.4 + i * 0.12);
      });
    }catch(_){ /* 忽略音频失败 */ }
  }

  function maybeNotify(){
    if(!('Notification' in window)) return;
    if(Notification.permission !== 'granted') return;
    try{
      const n = new Notification('五分钟 · 时间到', {
        body: '起来走两步，别坐太久。',
        icon: 'img/logo.png',
        tag: '5min-toilet-timer',
        renotify: true
      });
      n.onclick = function(){
        window.focus();
        n.close();
      };
      setTimeout(function(){ n.close(); }, 8000);
    }catch(_){ /* Safari 等限制 */ }
  }

  function requestNotifyOnce(){
    if(notifyAsked || !('Notification' in window)) return;
    if(Notification.permission !== 'default') return;
    notifyAsked = true;
    try{ Notification.requestPermission(); }catch(_){}
  }

  async function acquireWakeLock(){
    if(!('wakeLock' in navigator)) return;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock = null; });
    }catch(_){ wakeLock = null; }
  }

  async function releaseWakeLock(){
    if(!wakeLock) return;
    try{ await wakeLock.release(); }catch(_){}
    wakeLock = null;
  }

  function setPresetsEnabled(enabled){
    [...presets.children].forEach(function(b){ b.disabled = !enabled; });
  }

  function render(){
    timeText.textContent = fmt(remainMs);
    const ratio = totalMs > 0 ? Math.min(1, Math.max(0, remainMs / totalMs)) : 0;
    progress.style.strokeDashoffset = String(CIRC * (1 - ratio));

    if(!titleBlinkId){
      document.title = (running || remainMs < totalMs)
        ? fmt(remainMs) + ' · 五分钟'
        : '如厕计时器 · 五分钟';
    }

    document.body.classList.remove('warn', 'danger');
    if(finished){
      document.body.classList.add('danger');
      progress.style.stroke = 'var(--danger)';
      statusEl.textContent = '超时了，起来走两步';
      statusEl.style.color = 'var(--danger)';
    } else if(remainMs <= 60 * 1000 && (running || remainMs < totalMs)){
      document.body.classList.add('warn');
      progress.style.stroke = 'var(--warn)';
      statusEl.textContent = '最后 1 分钟，准备收尾';
      statusEl.style.color = 'var(--warn)';
    } else {
      progress.style.stroke = 'var(--safe)';
      if(running){
        statusEl.textContent = '计时中，别刷太投入';
      } else if(remainMs < totalMs){
        statusEl.textContent = '已暂停，点继续接着计';
      } else {
        statusEl.textContent = '点击开始，到点提醒你起来';
      }
      statusEl.style.color = 'var(--muted)';
    }
  }

  function clearTick(){
    if(tickId){
      clearTimeout(tickId);
      tickId = null;
    }
  }

  function scheduleTick(){
    clearTick();
    if(!running) return;
    const delay = Math.max(16, remainMs % 1000 || 1000);
    tickId = setTimeout(tick, delay);
  }

  function tick(){
    if(!running) return;
    remainMs = endAt - Date.now();
    if(remainMs <= 0){
      remainMs = 0;
      finish();
      return;
    }
    render();
    scheduleTick();
  }

  function finish(){
    running = false;
    finished = true;
    clearTick();
    releaseWakeLock();
    render();
    startBtn.textContent = '再来一次';
    startBtn.disabled = false;
    resetBtn.disabled = false;
    setPresetsEnabled(true);
    if(navigator.vibrate){
      try{ navigator.vibrate([200, 100, 200, 100, 400]); }catch(_){}
    }
    playChime();
    maybeNotify();
    startTitleBlink();
  }

  function start(){
    if(running){
      running = false;
      clearTick();
      remainMs = Math.max(0, endAt - Date.now());
      endAt = null;
      startBtn.textContent = '继续';
      releaseWakeLock();
      setPresetsEnabled(true);
      render();
      return;
    }

    stopTitleBlink();
    requestNotifyOnce();
    ensureAudio();

    if(remainMs <= 0 || finished){
      remainMs = totalMs;
      finished = false;
    }

    endAt = Date.now() + remainMs;
    running = true;
    finished = false;
    startBtn.textContent = '暂停';
    resetBtn.disabled = false;
    setPresetsEnabled(false);
    render();
    scheduleTick();
    acquireWakeLock();
  }

  function reset(){
    running = false;
    finished = false;
    endAt = null;
    clearTick();
    stopTitleBlink();
    releaseWakeLock();
    remainMs = totalMs;
    startBtn.textContent = '开始';
    startBtn.disabled = false;
    resetBtn.disabled = true;
    setPresetsEnabled(true);
    render();
  }

  function setPreset(min){
    if(!Number.isFinite(min) || min <= 0) return;
    if(running) return; // 计时中禁止切换，避免误触
    totalMs = min * 60 * 1000;
    [...presets.children].forEach(function(b){
      b.classList.toggle('active', +b.dataset.min === min);
    });
    reset();
  }

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  presets.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-min]');
    if(!btn || btn.disabled) return;
    const min = +btn.dataset.min;
    if(PRESET_MINS.indexOf(min) === -1) return;
    setPreset(min);
  });

  // 空格快捷键（不在可编辑控件内时）
  document.addEventListener('keydown', function(e){
    if(e.code !== 'Space' && e.key !== ' ') return;
    const tag = (e.target && e.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;
    if(e.target && e.target.isContentEditable) return;
    e.preventDefault();
    start();
  });

  // 切回标签页时校准（后台 setTimeout 可能被节流）
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    if(running){
      remainMs = endAt - Date.now();
      if(remainMs <= 0){
        remainMs = 0;
        finish();
      } else {
        render();
        scheduleTick();
        acquireWakeLock(); // 部分浏览器切后台后会释放
      }
    } else if(finished){
      startTitleBlink();
    }
  });

  // 离开页面前：若仍在计时，给一次确认（减少误关）
  window.addEventListener('beforeunload', function(e){
    if(!running) return;
    e.preventDefault();
    e.returnValue = '';
  });

  render();
})();
</script>
</body>
