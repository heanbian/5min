<style>
  :root{
    --brand:#2f9a68;
    --brand-strong:#248556;
    --brand-soft:#e5f5ec;
    --bg:#eef6f1;
    --bg-2:#f7faf8;
    --surface:#ffffff;
    --ink:#1f2a24;
    --muted:#5f6f66;
    --line:#d7e5dc;
    --ring:#cfe0d6;
    --safe:#2f9a68;
    --warn:#c9862d;
    --warn-soft:#fff6e8;
    --danger:#d2554a;
    --danger-soft:#ffefed;
    --radius-sm:10px;
    --radius:12px;
    --radius-lg:20px;
    --space:8px;
    --space-2:12px;
    --space-3:16px;
    --space-4:24px;
    --space-5:32px;
    --space-6:48px;
    --fs-xs:0.75rem;
    --fs-sm:0.8125rem;
    --fs-base:0.9375rem;
    --fs-md:1rem;
    --fs-lg:1.125rem;
    --lh-tight:1.25;
    --lh-body:1.65;
    --font:"Noto Sans SC","Source Han Sans SC",system-ui,sans-serif;
    --shadow-soft:0 10px 30px rgba(31, 90, 58, 0.07);
    --control-h:48px;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;
    font-family:var(--font);
    font-size:var(--fs-base);
    line-height:var(--lh-body);
    color:var(--ink);
    background:
      radial-gradient(1200px 560px at 50% -10%, #dff0e6 0%, transparent 58%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 48%, #f4f8f5 100%);
    transition:background-color .35s ease;
  }
  body.warn{
    background:
      radial-gradient(1200px 560px at 50% -10%, #ffe9c8 0%, transparent 58%),
      linear-gradient(180deg, var(--warn-soft) 0%, #fffaf2 100%);
  }
  body.danger{
    background:
      radial-gradient(1200px 560px at 50% -10%, #ffd7d2 0%, transparent 58%),
      linear-gradient(180deg, var(--danger-soft) 0%, #fff7f6 100%);
  }

  .app{
    width:min(100%, 440px);
    margin:0 auto;
    min-height:100dvh;
    padding:clamp(24px, 5vw, 40px) var(--space-4) var(--space-5);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:var(--space-4);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:var(--space-2);
    margin:0;
  }
  .brand img{
    width:44px;
    height:44px;
    display:block;
    border-radius:12px;
    box-shadow:var(--shadow-soft);
  }
  .brand-copy{display:flex;flex-direction:column;gap:2px}
  .brand h1{
    margin:0;
    font-size:var(--fs-lg);
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--ink);
    line-height:var(--lh-tight);
  }
  .brand p{
    margin:0;
    font-size:var(--fs-sm);
    color:var(--muted);
    font-weight:500;
  }

  .stage{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:var(--space-3);
    padding:var(--space-4) var(--space-3) var(--space-3);
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    border:1px solid color-mix(in srgb, var(--line) 80%, white);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-soft);
    backdrop-filter:blur(8px);
    animation:rise .55s ease both;
  }
  .dial{
    position:relative;
    width:min(72vw, 268px);
    aspect-ratio:1;
    display:grid;
    place-items:center;
  }
  .dial svg{
    position:absolute;inset:0;width:100%;height:100%;
    transform:rotate(-90deg);
  }
  .track{fill:none;stroke:var(--ring);stroke-width:9}
  .progress{
    fill:none;
    stroke:var(--safe);
    stroke-width:9;
    stroke-linecap:round;
    transition:stroke .35s ease;
  }
  .time{
    font-size:clamp(2.75rem, 12vw, 3.75rem);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:-0.03em;
    line-height:1;
    color:var(--ink);
  }
  .status{
    margin:0;
    min-height:1.5em;
    font-size:var(--fs-base);
    font-weight:500;
    color:var(--muted);
    text-align:center;
    padding:0 var(--space);
    transition:color .3s ease;
  }

  .actions{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:var(--space-3);
    animation:rise .55s ease .06s both;
  }
  .controls{
    display:grid;
    grid-template-columns:1.35fr 1fr;
    gap:var(--space-2);
  }
  button{
    font-family:inherit;
    font-size:var(--fs-md);
    font-weight:600;
    height:var(--control-h);
    padding:0 var(--space-4);
    border-radius:var(--radius);
    border:1px solid transparent;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, color .2s ease, transform .12s ease, box-shadow .2s ease;
  }
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
  button:focus-visible{
    outline:2px solid var(--brand);
    outline-offset:3px;
  }
  .primary{
    background:linear-gradient(180deg, #3aaa74 0%, var(--brand) 100%);
    color:#fff;
    box-shadow:0 8px 18px rgba(47, 154, 104, 0.22);
  }
  .primary:hover:not(:disabled){
    background:linear-gradient(180deg, #36a26e 0%, var(--brand-strong) 100%);
  }
  .ghost{
    background:var(--surface);
    color:var(--ink);
    border-color:var(--line);
  }
  .ghost:hover:not(:disabled){
    background:var(--brand-soft);
    border-color:color-mix(in srgb, var(--brand) 28%, var(--line));
    color:var(--brand-strong);
  }

  .presets{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:4px;
    padding:4px;
    background:color-mix(in srgb, var(--surface) 70%, var(--brand-soft));
    border:1px solid var(--line);
    border-radius:var(--radius);
  }
  .presets button{
    height:40px;
    min-width:0;
    padding:0 var(--space);
    font-size:var(--fs-sm);
    font-weight:600;
    color:var(--muted);
    background:transparent;
    border:none;
    border-radius:calc(var(--radius-sm) - 1px);
    box-shadow:none;
  }
  .presets button:hover:not(:disabled):not(.active){
    color:var(--ink);
    background:color-mix(in srgb, var(--surface) 80%, transparent);
  }
  .presets button.active{
    background:var(--surface);
    color:var(--brand-strong);
    box-shadow:0 1px 2px rgba(31, 42, 36, 0.06), 0 4px 12px rgba(47, 154, 104, 0.08);
  }
  .presets button:disabled{opacity:.4}

  .footnote{
    margin:var(--space) 0 0;
    max-width:36em;
    font-size:var(--fs-xs);
    color:var(--muted);
    text-align:center;
    line-height:1.75;
    animation:rise .55s ease .12s both;
  }
  .footnote a{
    color:var(--brand-strong);
    text-decoration:none;
  }
  .footnote a:hover{text-decoration:underline}

  @keyframes rise{
    from{opacity:0;transform:translateY(10px)}
    to{opacity:1;transform:none}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation:none!important;
      transition:none!important;
    }
  }
</style>
</head>
<body>

<main class="app">
  <header class="brand">
    <img src="img/logo.svg" width="44" height="44" alt="5min">
    <div class="brand-copy">
      <h1>如厕计时器</h1>
      <p>5min · 端侧提醒 · 无广告</p>
    </div>
  </header>

  <section class="stage" aria-label="计时区域">
    <div class="dial" role="timer" aria-atomic="true" aria-live="polite">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="54"></circle>
        <circle class="progress" id="progress" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="time" id="timeText">5:00</div>
    </div>
    <p class="status" id="status">点击开始，到期将提醒起身活动</p>
  </section>

  <section class="actions" aria-label="操作">
    <div class="controls">
      <button class="primary" id="startBtn" type="button" aria-keyshortcuts="Space">开始</button>
      <button class="ghost" id="resetBtn" type="button" disabled>重置</button>
    </div>
    <div class="presets" id="presets" role="group" aria-label="时长预设">
      <button type="button" data-min="3">3 分钟</button>
      <button type="button" data-min="5" class="active">5 分钟</button>
      <button type="button" data-min="10">10 分钟</button>
    </div>
  </section>

  <p class="footnote">
    公开资料常建议将单次如厕时间控制在约 5 分钟以内；使用移动设备易削弱时长感知。<br>
    本工具仅供习惯提醒，不构成医疗建议。正式站点
    <a href="https://5min.xuejibao.dev/">5min.xuejibao.dev</a>
  </p>
</main>

<script>
(function(){
  const CIRC = 2 * Math.PI * 54; // 与 SVG r=54 对应
  const PRESET_MINS = [3, 5, 10];
  // 支持 ?sec=2 做短时联调；正常访问默认 5 分钟
  const bootSec = Math.max(1, Math.min(3600, parseInt(new URLSearchParams(location.search).get('sec'), 10) || 0));
  const DEFAULT_MIN = bootSec ? bootSec / 60 : 5;

  const progress = document.getElementById('progress');
  const timeText = document.getElementById('timeText');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const presets  = document.getElementById('presets');

  let totalMs = DEFAULT_MIN * 60 * 1000;
  let remainMs = totalMs;
  let endAt = null;        // 运行时的目标时间戳
  let running = false;
  let tickId = null;
  let finished = false;
  let titleBlinkId = null;
  let audioCtx = null;
  let wakeLock = null;
  let notifyAsked = false;

  progress.style.strokeDasharray = String(CIRC);
  progress.style.strokeDashoffset = '0';

  function fmt(ms){
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function stopTitleBlink(){
    if(titleBlinkId){
      clearInterval(titleBlinkId);
      titleBlinkId = null;
    }
  }

  function startTitleBlink(){
    stopTitleBlink();
    let flip = false;
    titleBlinkId = setInterval(function(){
      document.title = flip ? '时间到 · 请起身活动' : '0:00 · 五分钟';
      flip = !flip;
    }, 800);
  }

  function ensureAudio(){
    if(audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }

  function playChime(){
    try{
      const ctx = ensureAudio();
      if(!ctx) return;
      if(ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach(function(freq, i){
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02 + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35 + i * 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.12);
        osc.stop(now + 0.4 + i * 0.12);
      });
    }catch(_){ /* 忽略音频失败 */ }
  }

  function maybeNotify(){
    if(!('Notification' in window)) return;
    if(Notification.permission !== 'granted') return;
    try{
      const n = new Notification('五分钟 · 时间到', {
        body: '计时已结束，请起身活动。',
        icon: 'img/logo.png',
        tag: '5min-toilet-timer',
        renotify: true
      });
      n.onclick = function(){
        window.focus();
        n.close();
      };
      setTimeout(function(){ n.close(); }, 8000);
    }catch(_){ /* Safari 等限制 */ }
  }

  function requestNotifyOnce(){
    if(notifyAsked || !('Notification' in window)) return;
    if(Notification.permission !== 'default') return;
    notifyAsked = true;
    try{ Notification.requestPermission(); }catch(_){}
  }

  async function acquireWakeLock(){
    if(!('wakeLock' in navigator)) return;
    try{
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock = null; });
    }catch(_){ wakeLock = null; }
  }

  async function releaseWakeLock(){
    if(!wakeLock) return;
    try{ await wakeLock.release(); }catch(_){}
    wakeLock = null;
  }

  function setPresetsEnabled(enabled){
    [...presets.children].forEach(function(b){ b.disabled = !enabled; });
  }

  function render(){
    timeText.textContent = fmt(remainMs);
    const ratio = totalMs > 0 ? Math.min(1, Math.max(0, remainMs / totalMs)) : 0;
    progress.style.strokeDashoffset = String(CIRC * (1 - ratio));

    if(!titleBlinkId){
      document.title = (running || remainMs < totalMs)
        ? fmt(remainMs) + ' · 五分钟'
        : '如厕计时器 · 五分钟';
    }

    document.body.classList.remove('warn', 'danger');
    if(finished){
      document.body.classList.add('danger');
      progress.style.stroke = 'var(--danger)';
      statusEl.textContent = '已超时，请起身活动';
      statusEl.style.color = 'var(--danger)';
    } else if(remainMs <= 60 * 1000 && (running || remainMs < totalMs)){
      document.body.classList.add('warn');
      progress.style.stroke = 'var(--warn)';
      statusEl.textContent = '最后 1 分钟，请准备结束';
      statusEl.style.color = 'var(--warn)';
    } else {
      progress.style.stroke = 'var(--safe)';
      if(running){
        statusEl.textContent = '计时进行中';
      } else if(remainMs < totalMs){
        statusEl.textContent = '已暂停，点击继续以恢复计时';
      } else {
        statusEl.textContent = '点击开始，到期将提醒起身活动';
      }
      statusEl.style.color = 'var(--muted)';
    }
  }

  function clearTick(){
    if(tickId){
      clearTimeout(tickId);
      tickId = null;
    }
  }

  function scheduleTick(){
    clearTick();
    if(!running) return;
    const delay = Math.max(16, remainMs % 1000 || 1000);
    tickId = setTimeout(tick, delay);
  }

  function tick(){
    if(!running) return;
    remainMs = endAt - Date.now();
    if(remainMs <= 0){
      remainMs = 0;
      finish();
      return;
    }
    render();
    scheduleTick();
  }

  function finish(){
    running = false;
    finished = true;
    clearTick();
    releaseWakeLock();
    render();
    startBtn.textContent = '再来一次';
    startBtn.disabled = false;
    resetBtn.disabled = false;
    setPresetsEnabled(true);
    if(navigator.vibrate){
      try{ navigator.vibrate([200, 100, 200, 100, 400]); }catch(_){}
    }
    playChime();
    maybeNotify();
    startTitleBlink();
  }

  function start(){
    if(running){
      running = false;
      clearTick();
      remainMs = Math.max(0, endAt - Date.now());
      endAt = null;
      startBtn.textContent = '继续';
      releaseWakeLock();
      setPresetsEnabled(true);
      render();
      return;
    }

    stopTitleBlink();
    requestNotifyOnce();
    ensureAudio();

    if(remainMs <= 0 || finished){
      remainMs = totalMs;
      finished = false;
    }

    endAt = Date.now() + remainMs;
    running = true;
    finished = false;
    startBtn.textContent = '暂停';
    resetBtn.disabled = false;
    setPresetsEnabled(false);
    render();
    scheduleTick();
    acquireWakeLock();
  }

  function reset(){
    running = false;
    finished = false;
    endAt = null;
    clearTick();
    stopTitleBlink();
    releaseWakeLock();
    remainMs = totalMs;
    startBtn.textContent = '开始';
    startBtn.disabled = false;
    resetBtn.disabled = true;
    setPresetsEnabled(true);
    render();
  }

  function setPreset(min){
    if(!Number.isFinite(min) || min <= 0) return;
    if(running) return; // 计时中禁止切换，避免误触
    totalMs = min * 60 * 1000;
    [...presets.children].forEach(function(b){
      b.classList.toggle('active', +b.dataset.min === min);
    });
    reset();
  }

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  presets.addEventListener('click', function(e){
    const btn = e.target.closest('button[data-min]');
    if(!btn || btn.disabled) return;
    const min = +btn.dataset.min;
    if(PRESET_MINS.indexOf(min) === -1) return;
    setPreset(min);
  });

  // 空格快捷键（不在可编辑控件内时）
  document.addEventListener('keydown', function(e){
    if(e.code !== 'Space' && e.key !== ' ') return;
    const tag = (e.target && e.target.tagName) || '';
    if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON' || tag === 'SELECT') return;
    if(e.target && e.target.isContentEditable) return;
    e.preventDefault();
    start();
  });

  // 切回标签页时校准（后台 setTimeout 可能被节流）
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState !== 'visible') return;
    if(running){
      remainMs = endAt - Date.now();
      if(remainMs <= 0){
        remainMs = 0;
        finish();
      } else {
        render();
        scheduleTick();
        acquireWakeLock(); // 部分浏览器切后台后会释放
      }
    } else if(finished){
      startTitleBlink();
    }
  });

  // 离开页面前：若仍在计时，给一次确认（减少误关）
  window.addEventListener('beforeunload', function(e){
    if(!running) return;
    e.preventDefault();
    e.returnValue = '';
  });

  render();
})();
</script>
</body>
</html>
